<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bento-grids</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sidebar"></div> <!-- Sidebar container -->
  
  <div class="main-content">
    <h2>Bento-grids</h2>
    <img src="image-4.png" width="500" alt="">
    <section class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
    </section>
  </div>

  <script src="sidebar.js"></script>
  <style>
    .container {
      background: lightsalmon;
      border: 3px solid black;
      border-radius: 10px;
      display: grid;
      /* Si queremos tener tres columnas  */
      /* grid-template-columns: 1fr 2fr; */
      /* Cambiamos las filas */
      grid-template-rows: 100px;
      /* Cada vez que tengas que generar una fila automaticamente quiero que tenga 100px */
      grid-auto-rows: 50px;
      /* puedes usar el repeat para repetir las columnas  */
      /* grid-template-columns: 10px repeat(3, 1fr) 20px; */
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
    }

    @media (width > 500px) {
      .container {
        grid-template-columns: minmax(100px, 1fr) 1fr 1fr;
      }
    }

    .container div {
      background: rgb(129, 188, 207);
      border: 2px solid rgb(22, 134, 209);
      border-radius: 6px;
    }

    .container div:first-child {
      background: lightgreen;
      border: 2px solid green;
      /* le podemos decir donde esta posicionado, ( Lo podemos ver con Google Chrome en el inspector de elementos) */
      grid-column-start: 1;
      grid-column-end: 2;
      grid-row-start: 1;
      grid-row-end: 3;
      /* Lo podemos mejorar sin tener que estar defiendo el end de esta forma  */
      /* Aqui le podemos decir lo que ocupa directamente */
      /* grid-column-start: span 2;
      grid-row-end: span 2; */

      /* Otra forma es decir que valla de la columna de 1 al 2 */
      grid-column: 1 / 2;
      /* lo mismo con la fila */
      grid-row: 1 /3;
    }
   
    .container div:nth-child(2) {
      background: lightseagreen;
      border: 2px solid green;
     
      /* Lo podemos mejorar sin tener que estar defiendo el end de esta forma  */
      /* Aqui le podemos decir lo que ocupa directamente */

      /* Lo podemos mover sin importart lo que tenga el HTML ( modo responsive te ayuda a mover elementos) */
      /* grid-column: 1 / 3   */
    }
  </style>
</body>
</html>
