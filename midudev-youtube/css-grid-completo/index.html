<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="sidebar"></div> <!-- Sidebar container -->
  
  <div class="main-content">
    <h2>Nuestra primer Grid</h2>
    <section class="container">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
    </section>
   <br/>
    <h2>Aliceacion en linea de los elementos</h2>
    <section class="container-2">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
    </section>
  </div>

  <script src="sidebar.js"></script>
  <style>
    .container {
      background: lightsalmon;
      border: 3px solid black;
      border-radius: 10px;
      display: grid;
      /* Si queremos tener tres columnas  */
      /* grid-template-columns: 1fr 2fr; */
      /* Cambiamos las filas */
      grid-template-rows: 100px;
      /* Cada vez que tengas que generar una fila automaticamente quiero que tenga 100px */
      grid-auto-rows: 50px;
      /* puedes usar el repeat para repetir las columnas  */
      /* grid-template-columns: 10px repeat(3, 1fr) 20px; */
      grid-template-columns: minmax(100px, 1fr) 1fr 1fr;
      /* 33.333% del espacio sea menor de 100px, se va a quedar en 100px */
    }

    .container div {
      background: lightblue;
      border: 2px solid #09f;
      border-radius: 6px;
    }
    
    /* --------------- Alineacion en linea de los elementos ---------- */
    .container-2 {
      background: lightblue;
      border: 3px solid black;
      border-radius: 10px;
      display: grid;
      grid-auto-rows: 50px;
      gap: 4px;
      padding: 4px;
      grid-template-columns: 50px 50px 50px;
      /* Le damos un ancho fijo */
      height: 300px;
      /* Centrar los ELEMENTOS (ITEMS) dentro de la Cuadricula*/
      /* Aqui le decimos que se estire y que ocupe toda la cuadricula asiganda, pero le podemos decir que este centrado con el center  */
      justify-items: stretch;
      justify-items: stretch;
      /* ALINEAR EL CONTENDIO DE LA CUADRICULA */
      justify-content: center;
      align-content: center;
      /* Forma corta */
      place-content: center;
    }

    .container-2 div {
      background: lightpink;
      border: 2px solid rosybrown;
      border-radius: 6px;
    }
  </style>
</body>
</html>
